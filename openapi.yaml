components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        detail:
          oneOf:
          - type: string
          - type: array
            items:
              type: object
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
      - email
      - password
    Token:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: bearer
        user:
          $ref: '#/components/schemas/User'
      required:
      - access_token
      - token_type
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - admin
          - editor
          - media
    Upload:
      type: object
      properties:
        url:
          type: string
        content_type:
          type: string
        size:
          type: integer
      required:
      - url
    Person:
      type: object
      properties:
        name:
          type: string
        title:
          type: string
        photo: &id006
          type: string
          description: URL returned by POST /uploads (or any https URL)
          nullable: true
        bio:
          type: string
        phone:
          type: string
        email:
          type: string
        office_hours:
          type: string
    Chaplaincy:
      type: object
      properties:
        chaplain:
          $ref: '#/components/schemas/Person'
        assistant_chaplain:
          $ref: '#/components/schemas/Person'
        secretary:
          $ref: '#/components/schemas/Person'
    Elder:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
        role:
          type: string
        portfolio:
          type: string
        department:
          type: string
        phone:
          type: string
        email:
          type: string
        photo: *id006
        bio:
          type: string
        order:
          type: integer
      required:
      - name
    CyfMeeting:
      type: object
      properties:
        label:
          type: string
        day:
          type: string
        time:
          type: string
    Cyf:
      type: object
      properties:
        about:
          type: string
        venue:
          type: string
        instagram:
          type: string
        youtube:
          type: string
        meetings:
          type: array
          items:
            $ref: '#/components/schemas/CyfMeeting'
    CyfLeader:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
        role:
          type: string
        department:
          type: string
        level:
          type: string
        phone:
          type: string
        photo: *id006
        order:
          type: integer
      required:
      - name
      - role
    CyfApplication:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
        department:
          type: string
        level:
          type: string
        whatsapp:
          type: string
        interests:
          type: array
          items:
            type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - name
    Message:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
        preacher:
          type: string
        date:
          type: string
          format: date
        series:
          type: string
        media_type:
          type: string
          enum:
          - audio
          - video
          - youtube
          - mixlr
        media_url:
          type: string
        thumbnail: *id006
        description:
          type: string
        published:
          type: boolean
      required:
      - title
      - media_type
    Event:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
        starts_at:
          type: string
          format: date-time
          description: Local Africa/Lagos time, e.g. 2026-10-18T09:00
        ends_at:
          type: string
          format: date-time
          nullable: true
        venue:
          type: string
        description:
          type: string
        banner: *id006
        is_special:
          type: boolean
        is_featured:
          type: boolean
      required:
      - title
      - starts_at
    Devotion:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        date:
          type: string
          format: date
        title:
          type: string
        scripture_ref:
          type: string
        scripture_text:
          type: string
        body:
          type: string
        author:
          type: string
        status:
          type: string
          enum:
          - draft
          - scheduled
          - published
      required:
      - date
      - title
      - body
    SubscribeRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        whatsapp:
          type: string
          description: E.164 preferred, e.g. +2348031234567
        channel:
          type: string
          enum:
          - email
          - whatsapp
          - both
      required:
      - channel
    Subscriber:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
        email:
          type: string
        whatsapp:
          type: string
        channel:
          type: string
          enum:
          - email
          - whatsapp
          - both
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
    GalleryPhoto:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        src:
          type: string
        caption:
          type: string
        order:
          type: integer
      required:
      - src
    Hymn:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        number:
          type: integer
        title:
          type: string
        author:
          type: string
        verses:
          type: array
          items:
            type: string
        chorus:
          type: string
      required:
      - number
      - title
    ServiceTime:
      type: object
      properties:
        label:
          type: string
        day:
          type: string
          enum:
          - ''
          - Sunday
          - Monday
          - Tuesday
          - Wednesday
          - Thursday
          - Friday
          - Saturday
        time:
          type: string
          example: 09:00
    Settings:
      type: object
      properties:
        church_name:
          type: string
