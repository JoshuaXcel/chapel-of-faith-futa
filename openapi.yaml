          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - *id003
      - *id004
      - *id005
      - name: published
        in: query
        required: false
        schema:
          type: boolean
        description: public site sends true; admin sees all only with a token
      - name: series
        in: query
        required: false
        schema:
          type: string
        description: ''
    post:
      summary: Create Message
      tags:
      - messages
      responses:
        '201':
