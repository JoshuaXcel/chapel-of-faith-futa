        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Message'
  /messages/recordings:
    post:
      summary: Upload a recording made in Admin → Messages → Record (beta). Creates a draft message. Declare this route BEFORE /messages/{id}
        in FastAPI.
      tags:
      - messages
      security: *id001
      parameters:
      - name: Upload-Id
        in: header
        required: false
        schema:
          type: string
        description: 'Optional chunked upload: same id on every chunk'
      - name: Content-Range
        in: header
        required: false
        schema:
          type: string
        description: bytes start-end/total for chunked upload; final chunk returns 201
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                title:
                  type: string
                preacher:
                  type: string
                date:
                  type: string
                  format: date
                series:
                  type: string
                duration_seconds:
                  type: number
                device_label:
                  type: string
              required:
              - file
      responses:
        '201':
          description: Draft message created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '202':
          description: Chunk accepted (chunked mode)
        '413':
          description: Too large
