      parameters: &id002
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: ''
    put:
      summary: Update Elder (partial updates accepted)
      tags:
      - elders
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Elder'
        '401':
