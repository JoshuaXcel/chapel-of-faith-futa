openapi: 3.0.3
info:
  title: The Chapel of Faith, FUTA · Website API
  version: 1.0.0
  description: Contract between the static website/admin panel (api.js) and the FastAPI backend. See API.md for notes. All JSON, UTF-8. Times
    are Africa/Lagos.
servers:
- url: https://api.chapeloffaithfuta.org/api/v1
  description: example production
- url: http://localhost:8000/api/v1
  description: local uvicorn
tags:
- name: auth
- name: uploads
- name: settings
- name: chaplaincy
- name: elders
- name: cyf
- name: messages
- name: events
- name: devotions
- name: subscribers
- name: gallery
- name: hymns
- name: prayer-requests
- name: counselling-bookings
- name: giving
- name: stats
- name: jobs
paths:
  /auth/login:
    post:
      summary: Log in, get a JWT
      tags:
      - auth
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '422':
          description: Validation error (FastAPI)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /auth/me:
    get:
      summary: Current admin user
      tags:
      - auth
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Missing/invalid token
        '422':
          description: Validation error (FastAPI)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: &id001
      - bearerAuth: []
  /uploads:
    post:
      summary: Upload an image, audio or video file (multipart). Returns its public URL.
      tags:
      - uploads
      security: *id001
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                kind:
                  type: string
                  enum:
                  - avatar
                  - image
                  - gallery
                  - media
                  - file
              required:
              - file
      responses:
        '201':
          description: Stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
        '413':
          description: File too large
        '415':
          description: Unsupported type
  /settings:
    get:
      summary: Get settings
      tags:
      - settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '422':
          description: Validation error (FastAPI)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: 'Update settings (merge: send only the keys that changed)'
      tags:
      - settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '401':
          description: Missing/invalid token
        '422':
          description: Validation error (FastAPI)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Settings'
  /chaplaincy:
