        '422':
          description: Validation error (FastAPI)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - &id003
        name: page
        in: query
        required: false
        schema:
          type: integer
        description: 1-based, default 1
      - &id004
        name: page_size
        in: query
        required: false
        schema:
          type: integer
        description: default 20, max 100
      - &id005
        name: q
        in: query
        required: false
        schema:
          type: string
        description: free-text search
    post:
      summary: Create Elder
      tags:
      - elders
      responses:
